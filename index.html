<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Student Attendance Camera Test</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #eef2f5;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    .header {
      background: #0b57d0;
      color: white;
      padding: 22px 15px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
    }

    #status {
      text-align: center;
      font-weight: bold;
      margin: 10px 0 15px;
      line-height: 1.5;
    }

    video {
      width: 100%;
      display: block;
      min-height: 250px;
      background: #000;
      border-radius: 12px;
      object-fit: cover;
    }

    .button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #0b57d0;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .success {
      color: #137333;
    }

    .error {
      color: #b00020;
    }

  </style>
</head>


<body>

<div class="container">

  <div class="header">

    <h1>CAMERA TEST</h1>

    <p>
      Student Attendance Scanner
    </p>

  </div>


  <div class="card">

    <div id="status">
      Press START CAMERA
    </div>

    <video
      id="camera"
      autoplay
      playsinline
      muted>
    </video>

  </div>


  <div class="card">

    <button
      class="button"
      onclick="startCamera()">

      START CAMERA

    </button>

  </div>

</div>


<script>

let cameraStream = null;


async function startCamera() {

  const status =
    document.getElementById("status");

  const video =
    document.getElementById("camera");


  status.className = "";

  status.innerText =
    "Requesting camera access...";


  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Camera access is not supported by this browser."
      );
    }


    // Stop an existing camera stream first.

    if (cameraStream) {

      cameraStream
        .getTracks()
        .forEach(function(track) {
          track.stop();
        });

    }


    // Request the rear camera.

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          }

        },

        audio: false

      });


    // Connect the camera to the video element.

    video.srcObject =
      cameraStream;


    await video.play();


    status.className =
      "success";

    status.innerText =
      "CAMERA WORKING";


  } catch (error) {

    console.error(error);


    status.className =
      "error";


    status.innerText =
      "CAMERA ERROR: " +
      (
        error.message ||
        String(error)
      );

  }

}

</script>

</body>

</html>
